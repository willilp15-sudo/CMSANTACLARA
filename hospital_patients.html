{% extends 'base.html' %}{% block content %}<h2>Pacientes</h2><form method=post class=grid><input name=documento placeholder="C.I./Documento" required><input name=nombre placeholder="Nombre completo" required><input type=date name=fecha_nacimiento><input name=telefono placeholder=Teléfono><input name=direccion placeholder=Dirección><button>Registrar paciente</button></form><table><tr><th>ID</th><th>Documento</th><th>Paciente</th><th>Teléfono</th><th>Acciones</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.documento}}</td><td>{{r.nombre}}</td><td>{{r.telefono}}</td><td><a href="/editar-paciente/{{r.id}}">Editar</a> <form method="post" action="/eliminar-paciente/{{r.id}}" style="display:inline" onsubmit="return confirm('¿Eliminar este registro?')"><input type="hidden" name="motivo" value="Registro erróneo"><button type="submit">Eliminar</button></form></td></tr>{% endfor %}</table>{% endblock %}
