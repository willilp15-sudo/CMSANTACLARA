<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turno confirmado</title><style>body{font-family:Arial;background:#f3f6f8}.box{max-width:600px;margin:70px auto;background:white;padding:30px;border-radius:14px;box-shadow:0 2px 12px #0001}a{color:#146b78}</style></head><body><div class="box">{% if r %}<h1>Turno confirmado</h1><p><b>Paciente:</b> {{r.paciente}}</p><p><b>Fecha:</b> {{r.fecha}} · <b>Hora:</b> {{r.hora}}</p><p><b>Profesional:</b> {{r.medico}}</p><p><b>Especialidad:</b> {{r.especialidad}}</p><p>El turno ya aparece automáticamente en la agenda interna de Santa Clara.</p>{% else %}<h1>Turno no encontrado</h1>{% endif %}<a href="/turnos-web">Volver al agendamiento</a></div></body></html>
