{% extends 'base.html' %}{% block content %}
<h2>Admisión / Urgencias / Internación</h2>
<form method=post class=grid><input type=date name=fecha required><select name=paciente_id>{% for x in pats %}<option value={{x.id}}>{{x.nombre}}</option>{% endfor %}</select><select name=tipo><option>CONSULTA</option><option>URGENCIA</option><option>INTERNACION</option><option>QUIROFANO</option></select><select name=medico_id><option value="">Médico</option>{% for x in med %}<option value={{x.id}}>{{x.nombre}}</option>{% endfor %}</select><select name=aseguradora_id><option value="">Particular</option>{% for x in aseg %}<option value={{x.id}}>{{x.nombre}}</option>{% endfor %}</select><select name=cama_id><option value="">Sin cama</option>{% for x in camas %}<option value={{x.id}}>{{x.codigo}}</option>{% endfor %}</select><select name=moneda>{% for x in mons %}<option>{{x.codigo}}</option>{% endfor %}</select><input name=tipo_cambio type=number step=.0001 placeholder="Tipo de cambio"><button>Admitir</button></form>
<table><tr><th>ID</th><th>Fecha</th><th>Paciente</th><th>Tipo</th><th>Estado</th><th>Cuenta</th><th>Acciones</th></tr>{% for r in rows %}<tr><td>{{r.id}}</td><td>{{r.fecha}}</td><td>{{r.paciente}}</td><td>{{r.tipo}}</td><td>{{r.estado}}</td><td><a href="/cuenta-paciente/{{r.id}}">Abrir cuenta</a></td><td style="white-space:nowrap"><a href="/admisiones/{{r.id}}/editar">✏️ Modificar</a>{% if r.estado!='ANULADA' %}<form method="post" action="/admisiones/{{r.id}}/eliminar" style="display:inline" onsubmit="return confirm('¿Eliminar esta admisión? Solo se eliminará si no tiene movimientos relacionados.')"><button type="submit">🗑 Eliminar</button></form><form method="post" action="/admisiones/{{r.id}}/anular" style="display:inline" onsubmit="var m=prompt('Motivo de anulación:'); if(!m)return false; this.motivo.value=m; return confirm('¿Confirmar anulación?');"><input type="hidden" name="motivo"><button type="submit">⛔ Anular</button></form>{% endif %}</td></tr>{% endfor %}</table>
{% endblock %}
