{% extends 'base.html' %}{% block title %}Clientes y Proveedores{% endblock %}{% block content %}<div class="toolbar"><input placeholder="🔍 Buscar cliente/proveedor..." oninput="filtrarTabla(this.value,'tablaTerceros')"><button type="button" onclick="document.getElementById('nuevo').scrollIntoView()">➕ Nuevo</button></div><form method="post" class="card grid" id="nuevo"><label>Tipo<select name="tipo"><option>CLIENTE</option><option>PROVEEDOR</option><option>AMBOS</option></select></label><label>RUC/Documento<input name="ruc"></label><label>Nombre<input name="nombre" required></label><label>Teléfono<input name="telefono"></label><label>Email<input name="email"></label><label>Moneda habitual<select name="moneda">{% for m in mons %}<option>{{m.codigo}}</option>{% endfor %}</select></label><button>💾 Guardar</button></form><div class="card table"><table id="tablaTerceros"><tr><th>Tipo</th><th>RUC</th><th>Nombre</th><th>Moneda</th><th>Acciones</th></tr>{% for r in rows %}<tr><td>{{r.tipo}}</td><td>{{r.ruc}}</td><td>{{r.nombre}}</td><td>{{r.moneda}}</td><td class="actions"><a class="btn small" href="/tercero/{{r.id}}/editar">✏️ Modificar</a><form method="post" action="/tercero/{{r.id}}/eliminar" onsubmit="return confirm('¿Eliminar registro?')"><button class="danger small">🗑 Eliminar</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
