{% extends 'base.html' %}{% block content %}<h1>Pacientes</h1><div class="panel"><form method=post class=inline><input name=document placeholder="Documento" required><input name=name placeholder="Nombre completo" required><input name=birth type=date><input name=phone placeholder="Teléfono"><input name=address placeholder="Dirección"><select name=insurance_id><option value="">Particular</option>{% for i in ins %}<option value={{i.id}}>{{i.name}} - {{i.plan}}</option>{% endfor %}</select><button>Registrar</button></form></div><div class=panel><table><tr><th>ID</th><th>Documento</th><th>Paciente</th><th>Teléfono</th><th>Seguro</th></tr>{% for x in rows %}<tr><td>{{x.id}}</td><td>{{x.document}}</td><td>{{x.name}}</td><td>{{x.phone}}</td><td>{{x.insurance or 'Particular'}}</td></tr>{% endfor %}</table></div>{% endblock %}
