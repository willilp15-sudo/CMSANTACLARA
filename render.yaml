services:
  - type: web
    name: santa-clara-erp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SANTA_CLARA_DATA_DIR
        value: /var/data
    disk:
      name: santa-clara-data
      mountPath: /var/data
      sizeGB: 1
