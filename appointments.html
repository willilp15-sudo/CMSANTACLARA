{% extends 'base.html' %}{% block content %}<h1>Agenda y Consultorio</h1><div class=panel><form method=post class=inline><select name=patient_id>{% for p in pats %}<option value={{p.id}}>{{p.name}}</option>{% endfor %}</select><select name=doctor_id>{% for d in docs %}<option value={{d.id}}>{{d.name}} · {{d.specialty}}</option>{% endfor %}</select><input type=datetime-local name=date_time required><input name=reason placeholder="Motivo"><button>Agendar</button></form></div><div class=panel><table><tr><th>Fecha</th><th>Paciente</th><th>Médico</th><th>Motivo</th><th>Estado</th></tr>{% for x in rows %}<tr><td>{{x.date_time}}</td><td>{{x.patient}}</td><td>{{x.doctor}}</td><td>{{x.reason}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
