{% extends 'base.html' %}{% block title %}Configuración RR.HH.{% endblock %}{% block content %}<section class="panel"><h2>Parámetros de Recursos Humanos</h2><p>Los porcentajes son parametrizables por seguridad ante cambios normativos. Verifique la vigencia antes de cerrar nómina.</p><form method="post" class="grid"><label>IPS obrero %<input type="number" step="0.01" name="ips_obrero_pct" value="{{cfg.ips_obrero_pct}}"></label><label>IPS patronal %<input type="number" step="0.01" name="ips_patronal_pct" value="{{cfg.ips_patronal_pct}}"></label><label>Cuenta Sueldos<input name="cuenta_sueldos" value="{{cfg.cuenta_sueldos}}"></label><label>Cuenta Cargas Sociales<input name="cuenta_cargas" value="{{cfg.cuenta_cargas}}"></label><label>Cuenta Obligaciones<input name="cuenta_obligaciones" value="{{cfg.cuenta_obligaciones}}"></label><button>Guardar parámetros</button></form></section>{% endblock %}
