{% extends 'base.html' %}{% block title %}Terminales POS{% endblock %}{% block content %}<h2>Terminales POS</h2><div class="card"><form method="post" class="grid"><label>Nombre / terminal<input name="nombre" required placeholder="Ej. POS 01 - Bancard"></label><label>Cuenta de acreditación<select name="cuenta_bancaria_id" required>{% for b in cuentas %}<option value="{{b.id}}">{{b.banco}} · {{b.alias or b.numero_cuenta}}</option>{% endfor %}</select></label><button>💾 Registrar POS</button></form></div><div class="card"><table><tr><th>Terminal</th><th>Banco</th><th>Cuenta</th><th>Estado</th></tr>{% for r in rows %}<tr><td>{{r.nombre}}</td><td>{{r.banco}}</td><td>{{r.alias}}</td><td>{{'Activo' if r.activo else 'Inactivo'}}</td></tr>{% endfor %}</table></div>{% endblock %}
