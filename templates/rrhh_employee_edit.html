{% extends 'base.html' %}{% block title %}Editar funcionario{% endblock %}{% block content %}<section class="panel"><h2>Editar ficha de {{e.nombre}}</h2><form method="post" class="grid"><label>Nombre<input name="nombre" value="{{e.nombre}}" required></label><label>CI<input name="documento" value="{{e.documento or ''}}"></label><label>RUC<input name="ruc" value="{{e.ruc or ''}}"></label><label>Nacimiento<input type="date" name="fecha_nacimiento" value="{{e.fecha_nacimiento or ''}}"></label><label>Teléfono<input name="telefono" value="{{e.telefono or ''}}"></label><label>Email<input name="email" value="{{e.email or ''}}"></label><label>Dirección<input name="direccion" value="{{e.direccion or ''}}"></label><label>Cargo<input name="cargo" value="{{e.cargo or ''}}"></label><label>Departamento<input name="departamento" value="{{e.departamento or ''}}"></label><label>Ingreso<input type="date" name="fecha_ingreso" value="{{e.fecha_ingreso or ''}}"></label><label>Salida<input type="date" name="fecha_salida" value="{{e.fecha_salida or ''}}"></label><label>Contrato<input name="tipo_contrato" value="{{e.tipo_contrato or ''}}"></label><label>Salario Gs.<input type="number" name="salario_base" value="{{e.salario_base or 0}}"></label><label>Nº IPS<input name="ips_numero" value="{{e.ips_numero or ''}}"></label><label><input type="checkbox" name="ips_activo" {% if e.ips_activo %}checked{% endif %}> Aporta IPS</label><label>Turno<input name="turno" value="{{e.turno or ''}}"></label><label>Estado<select name="estado"><option {% if e.estado=='ACTIVO' %}selected{% endif %}>ACTIVO</option><option {% if e.estado=='INACTIVO' %}selected{% endif %}>INACTIVO</option></select></label><label>Observación<textarea name="observacion">{{e.observacion or ''}}</textarea></label><button>Guardar cambios</button></form></section>{% endblock %}
