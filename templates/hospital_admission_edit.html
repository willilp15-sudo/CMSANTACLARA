{% extends 'base.html' %}{% block content %}
<div style="max-width:1300px;margin:0 auto"><h2>✏️ Modificar ingreso de paciente N.º {{'%06d'|format(a.id)}}</h2>
<form method="post" enctype="multipart/form-data" class="grid" data-visacion-form>
<label>Fecha de ingreso<input type="date" name="fecha" value="{{a.fecha}}" required></label><label>Hora de ingreso<input type="time" name="hora_ingreso" value="{{a.hora_ingreso or ''}}"></label>
<label>Paciente<select name="paciente_id" required>{% for x in pats %}<option value="{{x.id}}" {% if x.id==a.paciente_id %}selected{% endif %}>{{x.nombre}}</option>{% endfor %}</select></label>
<label>Tipo de ingreso<select name="tipo"><option value="INTERNACION" {% if a.tipo=='INTERNACION' %}selected{% endif %}>Internación</option><option value="QUIROFANO" {% if a.tipo=='QUIROFANO' %}selected{% endif %}>Cirugía / Quirófano</option></select></label>
<label>Médico tratante<select name="medico_id"><option value="">Sin médico</option>{% for x in med %}<option value="{{x.id}}" {% if x.id==a.medico_id %}selected{% endif %}>{{x.nombre}}</option>{% endfor %}</select></label>
<label>Plan / Seguro<select name="aseguradora_id"><option value="">Particular</option>{% for x in aseg %}<option value="{{x.id}}" {% if x.id==a.aseguradora_id %}selected{% endif %}>{{x.nombre}}</option>{% endfor %}</select></label>
<label>Número de carnet<input name="numero_carnet" value="{{a.numero_carnet or ''}}"></label><label>Sala / Cama<select name="cama_id"><option value="">Sin cama</option>{% for x in camas %}<option value="{{x.id}}" {% if x.id==a.cama_id %}selected{% endif %}>{{x.codigo}}</option>{% endfor %}</select></label>
<label>Moneda<select name="moneda">{% for x in mons %}<option value="{{x.codigo}}" {% if x.codigo==a.moneda %}selected{% endif %}>{{x.codigo}}</option>{% endfor %}</select></label><label>Tipo de cambio<input name="tipo_cambio" type="number" step=".0001" value="{{a.tipo_cambio or 1}}"></label>
<label style="grid-column:span 2">Facturar a<select name="facturado_a_tercero_id"><option value="">Al paciente (por defecto)</option>{% for x in terceros %}<option value="{{x.id}}" {% if x.id==a.facturado_a_tercero_id %}selected{% endif %}>{{x.nombre}} · {{x.ruc or 'Sin documento'}}</option>{% endfor %}</select></label>
<label style="grid-column:span 2">Diagnóstico / Motivo<input name="diagnostico" value="{{a.diagnostico or ''}}"></label><label style="grid-column:1/-1">Observaciones<textarea name="observaciones">{{a.observaciones or ''}}</textarea></label>
<h3 style="grid-column:1/-1">Acompañante / Responsable</h3><label>Nombre<input name="acompanante_nombre" value="{{a.acompanante_nombre or ''}}"></label><label>Cédula<input name="acompanante_documento" value="{{a.acompanante_documento or ''}}"></label><label>Teléfono<input name="acompanante_telefono" value="{{a.acompanante_telefono or ''}}"></label><label>Teléfono laboral<input name="acompanante_telefono_laboral" value="{{a.acompanante_telefono_laboral or ''}}"></label><label style="grid-column:span 2">Dirección<input name="acompanante_direccion" value="{{a.acompanante_direccion or ''}}"></label><label style="grid-column:span 2">Dirección laboral<input name="acompanante_direccion_laboral" value="{{a.acompanante_direccion_laboral or ''}}"></label>
<div class="visacion-seguro" style="display:none;grid-column:1/-1;border:1px solid #d9e2ec;border-radius:12px;padding:14px"><h4>🛡️ Visación del seguro</h4><div class="grid"><label>N.º visación<input name="numero_visacion" value="{{v.numero_visacion if v else ''}}" data-vis-required></label><label>Fecha<input type="date" name="fecha_visacion" value="{{v.fecha if v else a.fecha}}" data-vis-required></label><label>Hora<input type="time" name="hora_visacion" value="{{v.hora if v else ''}}" data-vis-required></label><label>Médico autorizado<select name="medico_visacion_id" data-vis-required><option value="">Seleccionar</option>{% for x in med %}<option value="{{x.id}}" {% if (v and x.id==v.medico_id) or (not v and x.id==a.medico_id) %}selected{% endif %}>{{x.nombre}}</option>{% endfor %}</select></label><label>Nuevo archivo<input type="file" name="archivo_visacion" accept="application/pdf,image/jpeg,image/png,image/webp"></label><label>Observación<input name="observacion_visacion" value="{{v.observacion if v else ''}}"></label></div></div>
<div style="grid-column:1/-1;display:flex;gap:10px"><button type="submit">💾 Guardar cambios</button><a class="btn" href="/ingreso-pacientes">Cancelar</a></div></form></div>
<script>(()=>{const f=document.querySelector('form[data-visacion-form]'),sel=f.querySelector('select[name="aseguradora_id"]'),box=f.querySelector('.visacion-seguro');const sync=()=>{const on=!!sel.value;box.style.display=on?'block':'none';box.querySelectorAll('[data-vis-required]').forEach(x=>x.required=on)};sel.addEventListener('change',sync);sync()})();</script>
{% endblock %}
