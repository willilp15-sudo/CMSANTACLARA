{% extends 'base.html' %}{% block title %}Centros de Costos{% endblock %}{% block content %}<h2>Centros de Costos</h2><form method="post" class="card grid"><label>Código<input name="codigo" required></label><label>Nombre<input name="nombre" required></label><button>Guardar</button></form><div class="card table"><table><tr><th>Código</th><th>Nombre</th><th>Estado</th></tr>{% for r in rows %}<tr><td>{{r.codigo}}</td><td>{{r.nombre}}</td><td>{{'ACTIVO' if r.activo else 'INACTIVO'}}</td></tr>{% endfor %}</table></div><a class="btn secondary" href="/contabilidad">← Contabilidad</a>{% endblock %}
