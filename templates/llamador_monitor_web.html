<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Llamador Santa Clara</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7fbfb;color:#123;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center}.box{width:min(1200px,94vw)}h1{font-size:clamp(28px,4vw,58px);margin:10px}.pac{font-size:clamp(42px,7vw,92px);font-weight:800;margin:8vh 0 3vh}.det{font-size:clamp(28px,4vw,55px);font-weight:700}.med{font-size:clamp(22px,3vw,38px);margin-top:20px}.st{position:fixed;bottom:18px;left:0;right:0;font-size:18px}.ok{color:#087f5b}.err{color:#c92a2a}.btn{position:fixed;right:20px;top:20px;padding:12px 18px;border:0;border-radius:10px;background:#1269d3;color:white;font-weight:700}</style></head><body><button class="btn" onclick="activar()">🔊 Activar voz / pantalla completa</button><div class="box"><h1>CENTRO MÉDICO SANTA CLARA</h1><div id="pac" class="pac">LLAMADA EN ESPERA</div><div id="det" class="det">Sala de espera</div><div id="med" class="med"></div><div id="st" class="st">Conectando con el ERP…</div></div><script>
let ultimo=0,vozActiva=false;function activar(){vozActiva=true;if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Llamador activado');u.lang='es-PY';speechSynthesis.speak(u)}
async function api(url,opt){let r=await fetch(url,opt);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
async function ciclo(){try{await api('/api/llamador/ping?dispositivo=MONITOR-WEB&sector=Sala%20de%20espera');let r=await api('/api/llamador/pendientes?dispositivo=MONITOR-WEB');document.getElementById('st').className='st ok';document.getElementById('st').textContent='● CONECTADO AL ERP';let x=r.llamada;if(x&&x.id!==ultimo){ultimo=x.id;document.getElementById('pac').textContent=(x.paciente||'PACIENTE').toUpperCase();document.getElementById('det').textContent='DIRIGIRSE AL CONSULTORIO '+(x.consultorio_numero||'');document.getElementById('med').textContent=x.medico||'';if(vozActiva&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x.texto||'');u.lang='es-PY';u.rate=.88;u.onend=()=>confirmar(x.id);u.onerror=()=>confirmar(x.id);speechSynthesis.speak(u)}else{await confirmar(x.id)}}}catch(e){document.getElementById('st').className='st err';document.getElementById('st').textContent='ERROR DE CONEXIÓN: '+e.message}setTimeout(ciclo,2500)}
async function confirmar(id){try{await api('/api/llamador/'+id+'/confirmar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dispositivo:'MONITOR-WEB'})})}catch(e){}}
ciclo();</script></body></html>
