{% extends 'base.html' %}{% block content %}<h1>{{title}}</h1><div class=panel><form method=post class=inline>{% for f in fields %}<input name="{{f}}" placeholder="{{f|replace('_',' ')|title}}" {% if f in ['coverage','salary','balance'] %}type=number step=.01{% endif %}>{% endfor %}<button>Guardar</button></form></div><div class=panel>{% if rows %}<table><tr>{% for k in rows[0].keys() %}<th>{{k}}</th>{% endfor %}</tr>{% for x in rows %}<tr>{% for k in x.keys() %}<td>{{x[k]}}</td>{% endfor %}</tr>{% endfor %}</table>{% else %}<p class=muted>Sin registros todavía.</p>{% endif %}</div>{% endblock %}
