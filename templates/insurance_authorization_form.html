{% extends 'base.html' %}{% block title %}Cargar Visación{% endblock %}{% block content %}<div class="card" style="max-width:1000px;margin:18px auto"><h2>🛡️ Cargar visación del seguro</h2><p><b>Paciente:</b> {{sp.paciente}} · <b>Seguro:</b> {{sp.aseguradora}} · <b>Prestación:</b> {{sp.descripcion}}</p><form method="post" enctype="multipart/form-data" class="grid"><label>N.º de visación<input name="numero_visacion" required></label><label>Fecha<input type="date" name="fecha_visacion" required value="{{sp.fecha}}"></label><label>Hora<input type="time" name="hora_visacion" required></label><label>Médico<select name="medico_visacion_id" required><option value="">Seleccionar</option>{% for m in meds %}<option value="{{m.id}}">{{m.nombre}}</option>{% endfor %}</select></label><label>Foto/PDF<input type="file" name="archivo_visacion" accept="application/pdf,image/jpeg,image/png,image/webp"></label><label>Observación<input name="observacion_visacion"></label><button>Guardar y vincular</button><a class="btn secondary" href="/seguros/facturar">Cancelar</a></form></div>{% endblock %}
