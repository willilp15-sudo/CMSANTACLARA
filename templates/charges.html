{% extends 'base.html' %}{% block c %}<h1>Servicios, procedimientos y medicamentos</h1><div class=panel><form method=post class=form><label>Admisión<select name=admission_id>{% for a in ads %}<option value={{a.id}}>#{{a.id}} {{a.name}} · {{a.type}}</option>{% endfor %}</select></label><label>Tipo<select name=kind><option>SERVICIO</option><option>MEDICAMENTO</option><option>INSUMO</option><option>PROCEDIMIENTO</option></select></label><label>Producto opcional<select name=product_id><option value=''>-- sin producto --</option>{% for p in prods %}<option value={{p.id}}>{{p.name}} · stock {{p.stock}}</option>{% endfor %}</select></label><label>Descripción<input name=description required></label><label>Cantidad<input name=qty type=number step=.01 value=1></label><label>Precio<input name=price type=number step=.01 required></label><button>Cargar a cuenta</button></form></div><div class=panel><table><tr><th>Paciente</th><th>Tipo</th><th>Descripción</th><th>Cant.</th><th>Precio</th><th>Total</th></tr>{% for r in rows %}<tr><td>{{r.patient}}</td><td>{{r.kind}}</td><td>{{r.description}}</td><td>{{r.qty}}</td><td>{{r.unit_price}}</td><td>{{r.total}}</td></tr>{% endfor %}</table></div>{% endblock %}
