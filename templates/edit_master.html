{% extends 'base.html' %}{% block title %}{{title}}{% endblock %}{% block content %}
<div class="card"><form method="post" class="grid">
{% if kind=='producto' %}<label>Código interno<input name="codigo" value="{{record.codigo}}" required></label><label>📷 Código de barras<input name="codigo_barras" value="{{record.codigo_barras or ''}}" autocomplete="off" placeholder="Escanee con el lector"></label><label>Producto<input name="nombre" value="{{record.nombre}}" required></label><label>Categoría<input name="categoria" value="{{record.categoria or ''}}"></label><label>IVA<select name="iva_pct"><option value="10" {% if record.iva_pct==10 %}selected{% endif %}>IVA 10%</option><option value="5" {% if record.iva_pct==5 %}selected{% endif %}>IVA 5%</option><option value="0" {% if record.iva_pct==0 %}selected{% endif %}>Exento</option></select></label><label>Costo final IVA incluido<input type="number" step=".01" name="costo_pyg" value="{{record.costo_pyg}}"></label><label>Precio final IVA incluido<input type="number" step=".01" name="precio_pyg" value="{{record.precio_pyg}}"></label><label>Stock mínimo<input type="number" step=".01" name="stock_min" value="{{record.stock_min}}"></label><label>Tipo de producto<select name="tipo_producto"><option value="">-- Seleccione --</option>{% for x in ['BIENES DE CAMBIO - FARMACIA','DESCARTABLE','MEDICAMENTO','INSUMO MÉDICO','SERVICIO','OTRO'] %}<option value="{{x}}" {% if record.tipo_producto==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Clasificación general<input name="clasif_general" value="{{record.clasif_general or ''}}"></label><label>Descripción SIFEN<input name="sifen_descripcion" value="{{record.sifen_descripcion or record.nombre or ''}}"></label><label>Unidad SIFEN código<input name="sifen_unidad_codigo" value="{{record.sifen_unidad_codigo or '77'}}"></label><label>Unidad SIFEN descripción<input name="sifen_unidad_desc" value="{{record.sifen_unidad_desc or 'UNI'}}"></label><div class="notice"><b>Control de stock:</b> los registros clasificados como SERVICIO no validan ni descuentan existencias al venderse.</div>
{% else %}<label>Tipo<select name="tipo">{% for x in ['CLIENTE','PROVEEDOR','AMBOS'] %}<option {% if record.tipo==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>RUC/Documento<input name="ruc" value="{{record.ruc or ''}}"></label><label>Nombre<input name="nombre" value="{{record.nombre}}" required></label><label>Teléfono<input name="telefono" value="{{record.telefono or ''}}"></label><label>Email<input name="email" value="{{record.email or ''}}"></label><label>Moneda<select name="moneda">{% for m in mons %}<option {% if record.moneda==m.codigo %}selected{% endif %}>{{m.codigo}}</option>{% endfor %}</select></label><h3>Datos fiscales SIFEN</h3><label>Naturaleza<select name="sifen_naturaleza"><option value="1" {% if (record.sifen_naturaleza or '1')=='1' %}selected{% endif %}>1 · Contribuyente</option><option value="2" {% if record.sifen_naturaleza=='2' %}selected{% endif %}>2 · No contribuyente</option></select></label><label>Tipo operación<select name="sifen_tipo_operacion">{% for v,n in [('1','B2B'),('2','B2C'),('3','B2G'),('4','B2F')] %}<option value="{{v}}" {% if (record.sifen_tipo_operacion or '1')==v %}selected{% endif %}>{{v}} · {{n}}</option>{% endfor %}</select></label><label>Tipo contribuyente<select name="sifen_tipo_contribuyente"><option value="1" {% if record.sifen_tipo_contribuyente=='1' %}selected{% endif %}>1 · Persona física</option><option value="2" {% if (record.sifen_tipo_contribuyente or '2')=='2' %}selected{% endif %}>2 · Persona jurídica</option></select></label><label>Tipo documento<input name="sifen_tipo_documento" value="{{record.sifen_tipo_documento or '1'}}"></label><label>Nº documento<input name="sifen_numero_documento" value="{{record.sifen_numero_documento or record.ruc or ''}}"></label><label>País código<input name="sifen_pais" value="{{record.sifen_pais or 'PRY'}}"></label><label>País descripción<input name="sifen_pais_desc" value="{{record.sifen_pais_desc or 'Paraguay'}}"></label><label>Dirección<input name="sifen_direccion" value="{{record.sifen_direccion or ''}}"></label><label>Nº casa<input name="sifen_numero_casa" value="{{record.sifen_numero_casa or '0'}}"></label><label>Departamento código<input name="sifen_departamento_codigo" value="{{record.sifen_departamento_codigo or ''}}"></label><label>Departamento descripción<input name="sifen_departamento_desc" value="{{record.sifen_departamento_desc or ''}}"></label><label>Distrito código<input name="sifen_distrito_codigo" value="{{record.sifen_distrito_codigo or ''}}"></label><label>Distrito descripción<input name="sifen_distrito_desc" value="{{record.sifen_distrito_desc or ''}}"></label><label>Ciudad código<input name="sifen_ciudad_codigo" value="{{record.sifen_ciudad_codigo or ''}}"></label><label>Ciudad descripción<input name="sifen_ciudad_desc" value="{{record.sifen_ciudad_desc or ''}}"></label>{% endif %}
<div class="actions"><button>💾 Guardar cambios</button><a class="btn secondary" href="{{'/productos' if kind=='producto' else '/terceros'}}">Cancelar</a></div></form></div>{% endblock %}
