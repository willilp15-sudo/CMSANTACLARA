{% extends 'base.html' %}{% block title %}{{title}}{% endblock %}{% block content %}
<div class="card"><form method="post" class="grid">
{% if kind=='producto' %}<label>Código interno<input name="codigo" value="{{record.codigo}}" required></label><label>📷 Código de barras<input name="codigo_barras" value="{{record.codigo_barras or ''}}" autocomplete="off" placeholder="Escanee con el lector"></label><label>Producto<input name="nombre" value="{{record.nombre}}" required></label><label>Categoría<input name="categoria" value="{{record.categoria or ''}}"></label><label>IVA<select name="iva_pct"><option value="10" {% if record.iva_pct==10 %}selected{% endif %}>IVA 10%</option><option value="5" {% if record.iva_pct==5 %}selected{% endif %}>IVA 5%</option><option value="0" {% if record.iva_pct==0 %}selected{% endif %}>Exento</option></select></label><label>Costo final IVA incluido<input type="number" step=".01" name="costo_pyg" value="{{record.costo_pyg}}"></label><label>Precio final IVA incluido<input type="number" step=".01" name="precio_pyg" value="{{record.precio_pyg}}"></label><label>Stock mínimo<input type="number" step=".01" name="stock_min" value="{{record.stock_min}}"></label>
{% else %}<label>Tipo<select name="tipo">{% for x in ['CLIENTE','PROVEEDOR','AMBOS'] %}<option {% if record.tipo==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>RUC/Documento<input name="ruc" value="{{record.ruc or ''}}"></label><label>Nombre<input name="nombre" value="{{record.nombre}}" required></label><label>Teléfono<input name="telefono" value="{{record.telefono or ''}}"></label><label>Email<input name="email" value="{{record.email or ''}}"></label><label>Moneda<select name="moneda">{% for m in mons %}<option {% if record.moneda==m.codigo %}selected{% endif %}>{{m.codigo}}</option>{% endfor %}</select></label>{% endif %}
<div class="actions"><button>💾 Guardar cambios</button><a class="btn secondary" href="{{'/productos' if kind=='producto' else '/terceros'}}">Cancelar</a></div></form></div>{% endblock %}
