{% extends 'base.html' %}{% block title %}Monedas y tipos de cambio{% endblock %}{% block content %}<form method="post" class="card grid"><label>Fecha<input type="date" name="fecha" required></label><label>Moneda<select name="moneda">{% for m in mons %}<option>{{m.codigo}}</option>{% endfor %}</select></label><label>Gs. por unidad<input type="number" step="0.0001" name="tipo" required></label><label>Fuente<input name="fuente" value="Manual"></label><button>Guardar tipo de cambio</button></form><div class="card table"><table><tr><th>Fecha</th><th>Moneda</th><th>Tipo</th><th>Fuente</th></tr>{% for r in rows %}<tr><td>{{r.fecha}}</td><td>{{r.moneda}}</td><td>{{r.tipo}}</td><td>{{r.fuente}}</td></tr>{% endfor %}</table></div>{% endblock %}
