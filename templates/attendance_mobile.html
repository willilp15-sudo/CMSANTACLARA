<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b57"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/static/asistencia-mobile.css"><title>Santa Clara Asistencia</title></head><body><main class="mobile-card"><img src="/static/logo_santa_clara_cropped.png" class="logo"><h1>Hola, {{empleado.nombre}}</h1><p>{{empleado.cargo or ''}}{% if empleado.departamento %} · {{empleado.departamento}}{% endif %}</p><div class="date">{{hoy}}</div><div id="msg"></div><div class="buttons"><button onclick="mark('ENTRADA')">Registrar entrada</button><button onclick="mark('INICIO_DESCANSO')">Inicio descanso</button><button onclick="mark('FIN_DESCANSO')">Fin descanso</button><button onclick="mark('SALIDA')">Registrar salida</button></div><h2>Marcaciones de hoy</h2><div id="marks">{% for m in marcaciones %}<div class="mark"><b>{{m.tipo.replace('_',' ')}}</b><span>{{m.hora}}</span></div>{% else %}<p>Aún no hay marcaciones.</p>{% endfor %}</div><a class="logout" href="/asistencia/logout">Cerrar sesión</a></main><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');async function mark(tipo){if(!confirm('¿Confirmar '+tipo.replaceAll('_',' ').toLowerCase()+'?'))return;let f=new FormData();f.append('tipo',tipo);let r=await fetch('/asistencia/marcar',{method:'POST',body:f});let j=await r.json();document.getElementById('msg').innerHTML='<div class="'+(j.ok?'ok':'alert')+'">'+(j.ok?'Marcación registrada: '+j.hora:j.error)+'</div>';if(j.ok)setTimeout(()=>location.reload(),700)}</script></body></html>
