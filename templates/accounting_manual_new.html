{% extends 'base.html' %}{% block title %}Nuevo asiento manual{% endblock %}{% block content %}<h2>Nuevo asiento manual</h2><p>Solo administración. Partida doble obligatoria; los asientos confirmados se corrigen por reversión.</p><form method="post" class="card"><label>Fecha<input type="date" name="fecha" value="{{fecha}}" required></label><label>Concepto<input name="concepto" required minlength="5" maxlength="250"></label><div class="table"><table id="lineas"><thead><tr><th>Cuenta</th><th>Debe (Gs.)</th><th>Haber (Gs.)</th><th>Detalle</th></tr></thead><tbody></tbody></table></div><button type="button" onclick="agregarLinea()">+ Añadir línea</button> <button type="submit">Confirmar asiento</button> <a class="btn secondary" href="/contabilidad/asientos">Volver</a></form><template id="fila"><tr><td><select name="cuenta" required><option value="">Seleccione</option>{% for c in cuentas %}<option value="{{c.codigo}}">{{c.codigo}} · {{c.nombre}}</option>{% endfor %}</select></td><td><input type="number" step="0.01" min="0" name="debe" value="0" required></td><td><input type="number" step="0.01" min="0" name="haber" value="0" required></td><td><input name="detalle"></td></tr></template><script>function agregarLinea(){document.querySelector('#lineas tbody').append(document.querySelector('#fila').content.cloneNode(true))}agregarLinea();agregarLinea();</script>{% endblock %}
