{% extends 'base.html' %}{% block title %}{{kind}}s{% endblock %}{% block content %}
<div class="toolbar"><form method="get" style="display:flex;gap:8px;align-items:center;flex:1"><input name="q" value="{{q or ''}}" placeholder="🔍 Buscar por comprobante, tercero, estado o fecha..." style="min-width:360px"><button type="submit">🔍 Buscar</button>{% if buscado %}<a class="btn" href="{{ '/compras' if kind=='Compra' else '/ventas/carga' }}">Limpiar</a>{% endif %}</form><a class="btn" href="/terceros">➕ {{'Proveedor' if kind=='Compra' else 'Cliente'}}</a><a class="btn" href="/productos">➕ Producto</a></div>
<form method="post" class="card grid transaction transaction-compact"><label>Fecha<input type="date" name="fecha" required></label><label>N.º comprobante<input name="numero" required></label><label>{{'Proveedor' if kind=='Compra' else 'Cliente'}}<div class="lookup"><div class="sc-searchbox" data-url="/api/buscar-proveedores" data-kind="proveedor"><input type="search" data-search placeholder="Escriba nombre o RUC del proveedor" autocomplete="off" required><input type="hidden" name="proveedor_id" required><div class="sc-results" style="display:none"></div><div class="sc-selected"></div></div><a title="Buscar/crear" href="/terceros">🔍➕</a></div></label><label>Moneda<select name="moneda" class="moneda">{% for m in mons %}<option>{{m.codigo}}</option>{% endfor %}</select></label><label>Tipo de cambio<input class="tc" type="number" step="0.0001" name="tipo_cambio" value="1"></label>{% if kind=='Compra' %}<label>N.º de Timbrado<input name="timbrado" required inputmode="numeric" autocomplete="off" placeholder="Ej.: 12345678"></label><label>Vencimiento del timbrado<input type="date" name="timbrado_vencimiento" required><small style="grid-column:1/-1" class="muted">El sistema no permitirá registrar el comprobante si la fecha de la compra es posterior al vencimiento del timbrado.</small>{% endif %}{% if kind=='Venta' %}<div class="card" style="grid-column:1/-1"><h3>Detalle de la venta</h3><div class="grid"><label>🔎 Producto por código de barras, código interno o nombre<input type="text" id="scanner_producto" autocomplete="off" placeholder="Escanee o escriba y presione Enter"></label><label>Producto encontrado<select id="producto_venta"><option value="">-- Ningún producto seleccionado --</option></select></label><label>Cantidad<input type="number" id="cantidad_venta" step="0.01" min="0.01" value="1"></label><label>Precio unitario FINAL (IVA incluido)<input type="number" id="precio_venta" step="0.01" min="0" value="0"></label><button type="button" onclick="agregarItemVenta()">➕ Agregar ítem</button></div><input type="hidden" name="items_json" id="items_json" value="[]"><div class="table"><table id="tablaItemsVenta"><thead><tr><th>#</th><th>Producto</th><th>Cant.</th><th>Precio</th><th>IVA</th><th>Subtotal</th><th>Acción</th></tr></thead><tbody></tbody></table></div><div style="text-align:right"><b>Total venta: <span id="totalVenta">0</span></b></div><small>Puede agregar tantos productos como necesite. Si escanea nuevamente el mismo código, se incrementa la cantidad del ítem existente.</small></div>{% else %}<div class="card" style="grid-column:1/-1"><h3>Detalle de la compra</h3><div class="grid"><label>🔎 Producto por código de barras, código interno o nombre<input type="text" id="scanner_producto" autocomplete="off" placeholder="Escanee o escriba y presione Enter"></label><label>Producto encontrado<select id="producto_compra"><option value="">-- Ningún producto seleccionado --</option></select></label><label>Cantidad<input type="number" id="cantidad_compra" step="0.01" min="0.01" value="1"></label><label>Costo unitario FINAL (IVA incluido)<input type="number" id="costo_compra" step="0.01" min="0" value="0"></label><button type="button" onclick="agregarItemCompra()">➕ Agregar ítem</button></div><input type="hidden" name="items_json" id="items_json" value="[]"><div class="table"><table id="tablaItemsCompra"><thead><tr><th>#</th><th>Producto</th><th>Cant.</th><th>Costo</th><th>IVA</th><th>Subtotal</th><th>Acción</th></tr></thead><tbody></tbody></table></div><div style="text-align:right"><b>Total compra: <span id="totalCompra">0</span></b></div><small>Puede agregar tantos productos como necesite. Al escanear nuevamente el mismo código se incrementa la cantidad.</small></div>{% endif %}{% if kind=='Compra' %}<label>Condición de pago<select name="condicion_pago" id="condicion_pago" onchange="cambiaCompra()"><option value="CONTADO">CONTADO</option><option value="CREDITO">CRÉDITO</option><option value="CUOTAS">CRÉDITO EN CUOTAS</option></select></label><label id="cp_venc">Fecha de vencimiento<input type="date" name="fecha_vencimiento"></label><label id="cp_entrega">Entrega inicial<input type="number" step="0.01" min="0" name="entrega_inicial" value="0"></label><label id="cp_medio">Forma de pago<select name="medio_pago_inicial"><option>EFECTIVO</option><option>BANCO</option><option>TRANSFERENCIA</option><option>POS</option></select></label><label id="cp_ref">Referencia<input name="referencia_pago" placeholder="Operación / transferencia / POS"></label><input type="hidden" name="cuotas_json" id="cuotas_json" value="[]"><div id="cuotas_box" class="card" style="grid-column:1/-1"><b>Plan de cuotas</b><div class="grid"><label>Vencimiento<input type="date" id="nueva_fecha"></label><label>Importe<input type="number" step="0.01" min="0.01" id="nuevo_importe"></label><button type="button" onclick="agregarCuota()">➕ Agregar cuota</button></div><table id="tablaCuotas"><tr><th>N.º</th><th>Vencimiento</th><th>Importe</th><th>Acción</th></tr></table><small>Antes de confirmar, puede modificar eliminando una cuota y agregándola nuevamente. Después de guardar, use “Cuotas” en la compra para modificar/eliminar cuotas pendientes.</small></div>{% endif %}{% if kind=='Venta' %}<label>Condición de venta<select name="condicion_venta" id="condicion_venta" onchange="cambiaCondicion()"><option value="CONTADO">CONTADO</option><option value="CREDITO">CRÉDITO</option><option value="CUOTAS">CRÉDITO EN CUOTAS</option></select></label><label id="venta_venc">Vencimiento<input type="date" name="fecha_vencimiento_venta"></label><label id="venta_entrega">Entrega inicial<input type="number" step="0.01" min="0" name="entrega_inicial_venta" id="entrega_inicial_venta" value="0"></label><label id="lbl_forma">Forma de cobro<select name="forma_cobro"><option>Efectivo</option><option>Banco</option><option>Transferencia</option><option>POS</option></select></label><label id="lbl_ref">Referencia<input name="referencia_cobro" placeholder="Operación / transferencia / POS"></label><label id="lbl_cuenta">Cuenta receptora<select name="cuenta_bancaria_id"><option value="">-- Seleccionar --</option>{% for b in cuentas or [] %}<option value="{{b.id}}">{{b.banco}} · {{b.alias or b.numero_cuenta}}</option>{% endfor %}</select></label><label id="lbl_pos">Terminal POS<select name="terminal_pos_id"><option value="">-- Seleccionar --</option>{% for p in poses or [] %}<option value="{{p.id}}">{{p.nombre}}</option>{% endfor %}</select></label>{% if kind=='Venta' %}<input type="hidden" name="venta_cuotas_json" id="venta_cuotas_json" value="[]"><div class="card" id="venta_cuotas_box" style="grid-column:1/-1"><h3>Plan de cuotas de la venta</h3><div class="grid"><label>Vencimiento<input type="date" id="venta_nueva_fecha"></label><label>Importe<input type="number" step="0.01" min="0.01" id="venta_nuevo_importe"></label><button type="button" onclick="agregarCuotaVenta()">➕ Agregar cuota</button></div><table id="tablaCuotasVenta"><tr><th>N.º</th><th>Vencimiento</th><th>Importe</th><th>Acción</th></tr></table><small>La entrega inicial más la suma de las cuotas debe coincidir con el total de la venta.</small></div>{% endif %}{% endif %}<button>💾 Confirmar {{kind|lower}}</button></form>
<div class="card table"><h3>Consulta de {{kind|lower}}s</h3>{% if not buscado %}<p class="muted">No se cargan operaciones automáticamente. Escriba un comprobante, tercero, estado o fecha y presione <b>Buscar</b>.</p>{% elif not rows %}<p class="muted">No se encontraron resultados para “{{q}}”.</p>{% endif %}<table id="tablaTx" {% if not buscado or not rows %}style="display:none"{% endif %}><tr><th>Fecha</th><th>N.º</th><th>Tercero</th><th>Estado</th>{% if kind=='Venta' %}<th>Condición</th>{% endif %}<th>IVA 10%</th><th>IVA 5%</th><th>Exento</th><th>Total</th><th>Acciones</th></tr>{% for r in rows %}<tr><td>{{r.fecha}}</td><td>{{r.numero}}</td><td>{{r.tercero}}</td><td>{{r.estado}}</td>{% if kind=='Venta' %}<td>{{r.condicion_venta or 'CRÉDITO'}}</td>{% endif %}<td>{{'{:,.2f}'.format(r.iva_10 or 0)}}</td><td>{{'{:,.2f}'.format(r.iva_5 or 0)}}</td><td>{{'{:,.2f}'.format(r.exento_iva or 0)}}</td><td>{{'{:,.2f}'.format(r.total)}}</td><td>{% if kind=='Compra' %}<a class="btn small" href="/compras/{{r.id}}/ver">👁 Ver</a>{% if r.estado!='ANULADA' %}<a class="btn small" href="/compras/{{r.id}}/editar">✏️ Modificar</a>{% endif %}{% if r.condicion_pago=='CUOTAS' %}<a class="btn small" href="/compras/{{r.id}}/cuotas">💳 Cuotas</a>{% endif %}{% endif %}{% if kind=='Venta' and r.condicion_venta in ['CREDITO','CUOTAS'] %}<a class="btn small" href="/ventas/{{r.id}}/cuotas">💳 Cuotas</a>{% endif %}{% if kind=='Venta' %}<a class="btn small" href="/ventas/{{r.id}}/factura">🧾 Factura</a><a class="btn small" target="_blank" href="/ventas/{{r.id}}/factura/pdf">📄 PDF</a>{% endif %}{% if r.estado!='ANULADA' %}<form method="post" action="/transaccion/{{kind|lower}}/{{r.id}}/anular" onsubmit="return confirm('¿Anular y revertir esta {{kind|lower}}?')"><button class="danger small">⛔ Anular</button></form>{% else %}<span class="muted">Anulada</span>{% endif %}</td></tr>{% endfor %}</table></div><script>
const isVenta={{ 'true' if kind=='Venta' else 'false' }};
const isCompra=!isVenta;
let itemsVenta=[],itemsCompra=[];
function fmt(n){return Number(n||0).toLocaleString('es-PY',{maximumFractionDigits:2})}
function renderItemsVenta(){if(!isVenta)return;const tb=document.querySelector('#tablaItemsVenta tbody');tb.innerHTML=itemsVenta.map((x,i)=>`<tr><td>${i+1}</td><td>${x.nombre}</td><td><input style="width:85px" type="number" min="0.01" step="0.01" value="${x.cantidad}" onchange="editarCantidad(${i},this.value)"></td><td><input style="width:130px" type="number" min="0" step="0.01" value="${x.precio}" onchange="editarPrecio(${i},this.value)"></td><td>${x.iva==0?'Exento':x.iva+'%'}</td><td>${fmt(x.cantidad*x.precio)}</td><td><button type="button" class="danger small" onclick="quitarItem(${i})">🗑 Quitar</button></td></tr>`).join('');document.getElementById('items_json').value=JSON.stringify(itemsVenta.map(x=>({producto_id:x.producto_id,cantidad:x.cantidad,precio:x.precio})));document.getElementById('totalVenta').textContent=fmt(itemsVenta.reduce((a,x)=>a+x.cantidad*x.precio,0));}
function agregarItemVenta(){const sel=document.getElementById('producto_venta'),o=sel.options[sel.selectedIndex],id=Number(sel.value),q=Number(document.getElementById('cantidad_venta').value||0),pr=Number(document.getElementById('precio_venta').value||0);if(!id||q<=0||pr<0){alert('Revise producto, cantidad y precio.');return}const ex=itemsVenta.find(x=>x.producto_id===id);if(ex){ex.cantidad+=q;if(pr>=0)ex.precio=pr}else itemsVenta.push({producto_id:id,nombre:o.text.split(' · Stock')[0],cantidad:q,precio:pr,iva:Number(o.dataset.iva||0)});renderItemsVenta();document.getElementById('cantidad_venta').value=1;document.getElementById('scanner_producto').focus();}
function quitarItem(i){itemsVenta.splice(i,1);renderItemsVenta()} function editarCantidad(i,v){v=Number(v);if(v>0)itemsVenta[i].cantidad=v;renderItemsVenta()} function editarPrecio(i,v){v=Number(v);if(v>=0)itemsVenta[i].precio=v;renderItemsVenta()}
function renderItemsCompra(){if(!isCompra)return;const tb=document.querySelector('#tablaItemsCompra tbody');tb.innerHTML=itemsCompra.map((x,i)=>`<tr><td>${i+1}</td><td>${x.nombre}</td><td><input style="width:85px" type="number" min="0.01" step="0.01" value="${x.cantidad}" onchange="editarCantidadCompra(${i},this.value)"></td><td><input style="width:130px" type="number" min="0" step="0.01" value="${x.costo}" onchange="editarCostoCompra(${i},this.value)"></td><td>${x.iva==0?'Exento':x.iva+'%'}</td><td>${fmt(x.cantidad*x.costo)}</td><td><button type="button" class="danger small" onclick="quitarItemCompra(${i})">🗑 Quitar</button></td></tr>`).join('');document.getElementById('items_json').value=JSON.stringify(itemsCompra.map(x=>({producto_id:x.producto_id,cantidad:x.cantidad,costo:x.costo})));document.getElementById('totalCompra').textContent=fmt(itemsCompra.reduce((a,x)=>a+x.cantidad*x.costo,0));}
function agregarItemCompra(){const sel=document.getElementById('producto_compra'),o=sel.options[sel.selectedIndex],id=Number(sel.value),q=Number(document.getElementById('cantidad_compra').value||0),co=Number(document.getElementById('costo_compra').value||0);if(!id||q<=0||co<0){alert('Revise producto, cantidad y costo.');return}const ex=itemsCompra.find(x=>x.producto_id===id);if(ex){ex.cantidad+=q;if(co>=0)ex.costo=co}else itemsCompra.push({producto_id:id,nombre:o.text.split(' · Stock')[0],cantidad:q,costo:co,iva:Number(o.dataset.iva||0)});renderItemsCompra();document.getElementById('cantidad_compra').value=1;document.getElementById('scanner_producto').focus();}
function quitarItemCompra(i){itemsCompra.splice(i,1);renderItemsCompra()} function editarCantidadCompra(i,v){v=Number(v);if(v>0)itemsCompra[i].cantidad=v;renderItemsCompra()} function editarCostoCompra(i,v){v=Number(v);if(v>=0)itemsCompra[i].costo=v;renderItemsCompra()}
async function buscarProducto(texto,selectId,silencioso=false){
 const q=(texto||'').trim(); if(!q)return false;
 const sel=document.getElementById(selectId);
 try{
  const r=await fetch('/api/productos/buscar?q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
  if(!r.ok){let msg='No se pudo consultar productos';try{const e=await r.json();msg=e.error||msg}catch(_){ }throw new Error(msg)}
  const data=await r.json();
  if(!Array.isArray(data))throw new Error('Respuesta inválida al buscar productos');
  sel.innerHTML='<option value="">-- Seleccione un resultado --</option>';
  data.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=`${p.codigo||''} · ${p.nombre} · Stock ${p.stock}`;o.dataset.barcode=p.codigo_barras||'';o.dataset.iva=p.iva_pct||0;o.dataset.precio=p.precio_pyg||0;o.dataset.costo=p.costo_pyg||0;sel.appendChild(o)});
  if(data.length===1){sel.selectedIndex=1;sel.dispatchEvent(new Event('change'));return true}
  if(data.length===0){if(!silencioso)alert('Producto no encontrado. Busque por código de barras, código interno o nombre.');return false}
  return true;
 }catch(err){console.error(err);if(!silencioso)alert(err.message||'Error al buscar productos');return false}
}
let temporizadorBusqueda=null;
const buscadorProducto=document.getElementById('scanner_producto');
if(buscadorProducto){buscadorProducto.addEventListener('input',()=>{clearTimeout(temporizadorBusqueda);const q=buscadorProducto.value.trim();if(q.length<2)return;temporizadorBusqueda=setTimeout(()=>buscarProducto(q,isVenta?'producto_venta':'producto_compra',true),280)});}
if(isVenta){const pv=document.getElementById('producto_venta'),sc=document.getElementById('scanner_producto');function cargarPrecio(){const o=pv.options[pv.selectedIndex];document.getElementById('precio_venta').value=Number(o?.dataset.precio||0)}pv.addEventListener('change',cargarPrecio);sc.addEventListener('keydown',async e=>{if(e.key==='Enter'){e.preventDefault();const exacto=await buscarProducto(sc.value,'producto_venta');if(exacto&&pv.options.length===2){document.getElementById('cantidad_venta').value=1;agregarItemVenta();sc.value='';pv.innerHTML='<option value="">-- Ningún producto seleccionado --</option>';document.getElementById('precio_venta').value=0}});document.querySelector('form.transaction').addEventListener('submit',e=>{if(itemsVenta.length===0){e.preventDefault();alert('Agregue al menos un ítem a la venta.')}})}else{const pc=document.getElementById('producto_compra'),sc=document.getElementById('scanner_producto');function cargarCosto(){const o=pc.options[pc.selectedIndex];document.getElementById('costo_compra').value=Number(o?.dataset.costo||0)}pc.addEventListener('change',cargarCosto);sc.addEventListener('keydown',async e=>{if(e.key==='Enter'){e.preventDefault();const exacto=await buscarProducto(sc.value,'producto_compra');if(exacto&&pc.options.length===2){document.getElementById('cantidad_compra').value=1;agregarItemCompra();sc.value='';pc.innerHTML='<option value="">-- Ningún producto seleccionado --</option>';document.getElementById('costo_compra').value=0}});document.querySelector('form.transaction').addEventListener('submit',e=>{if(itemsCompra.length===0){e.preventDefault();alert('Agregue al menos un ítem a la compra.')}})}
let cuotas=[];function renderCuotas(){const t=document.getElementById('tablaCuotas');if(!t)return;t.innerHTML='<tr><th>N.º</th><th>Vencimiento</th><th>Importe</th><th>Acción</th></tr>'+cuotas.map((q,i)=>`<tr><td>${i+1}</td><td>${q.fecha}</td><td>${Number(q.importe).toLocaleString()}</td><td><button type="button" onclick="eliminarCuota(${i})">🗑 Eliminar</button></td></tr>`).join('');document.getElementById('cuotas_json').value=JSON.stringify(cuotas)}function agregarCuota(){const f=document.getElementById('nueva_fecha').value,im=Number(document.getElementById('nuevo_importe').value||0);if(!f||im<=0){alert('Indique vencimiento e importe.');return}cuotas.push({fecha:f,importe:im});renderCuotas();document.getElementById('nuevo_importe').value=''}function eliminarCuota(i){cuotas.splice(i,1);renderCuotas()}function cambiaCompra(){const e=document.getElementById('condicion_pago');if(!e)return;const v=e.value;document.getElementById('cp_venc').style.display=v==='CREDITO'?'':'none';document.getElementById('cp_entrega').style.display=v==='CUOTAS'?'':'none';document.getElementById('cuotas_box').style.display=v==='CUOTAS'?'':'none';document.getElementById('cp_medio').style.display=(v==='CONTADO'||v==='CUOTAS')?'':'none';document.getElementById('cp_ref').style.display=(v==='CONTADO'||v==='CUOTAS')?'':'none'}cambiaCompra();renderCuotas();let cuotasVenta=[];function renderCuotasVenta(){const t=document.getElementById('tablaCuotasVenta');if(!t)return;t.innerHTML='<tr><th>N.º</th><th>Vencimiento</th><th>Importe</th><th>Acción</th></tr>'+cuotasVenta.map((q,i)=>`<tr><td>${i+1}</td><td>${q.fecha}</td><td>${fmt(q.importe)}</td><td><button type="button" onclick="eliminarCuotaVenta(${i})">🗑 Eliminar</button></td></tr>`).join('');document.getElementById('venta_cuotas_json').value=JSON.stringify(cuotasVenta)}function agregarCuotaVenta(){const f=document.getElementById('venta_nueva_fecha').value,im=Number(document.getElementById('venta_nuevo_importe').value||0);if(!f||im<=0){alert('Indique vencimiento e importe.');return}cuotasVenta.push({fecha:f,importe:im});renderCuotasVenta();document.getElementById('venta_nuevo_importe').value=''}function eliminarCuotaVenta(i){cuotasVenta.splice(i,1);renderCuotasVenta()}function cambiaCondicion(){const c=document.getElementById('condicion_venta');if(!c)return;const cont=c.value==='CONTADO',cuo=c.value==='CUOTAS',cred=c.value==='CREDITO';const ent=Number(document.getElementById('entrega_inicial_venta')?.value||0);document.getElementById('venta_venc').style.display=cred?'':'none';document.getElementById('venta_entrega').style.display=cuo?'':'none';document.getElementById('venta_cuotas_box').style.display=cuo?'':'none';const showPago=cont||(cuo&&ent>0);document.getElementById('lbl_forma').style.display=showPago?'':'none';document.getElementById('lbl_ref').style.display=showPago?'':'none';const m=document.querySelector('[name=forma_cobro]')?.value||'';document.getElementById('lbl_cuenta').style.display=showPago&&m!=='Efectivo'?'':'none';document.getElementById('lbl_pos').style.display=showPago&&m==='POS'?'':'none';}document.querySelector('[name=forma_cobro]')?.addEventListener('change',cambiaCondicion);document.getElementById('entrega_inicial_venta')?.addEventListener('input',cambiaCondicion);renderCuotasVenta();cambiaCondicion();
</script>{% endblock %}
