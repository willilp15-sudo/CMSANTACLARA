{% extends 'base.html' %}{% block content %}<h1>Admisión · Urgencias · Internación</h1><div class=panel><form method=post class=inline><select name=patient_id required>{% for p in pats %}<option value={{p.id}}>{{p.name}}</option>{% endfor %}</select><select name=type><option>CONSULTA</option><option>URGENCIA</option><option>INTERNACION</option></select><select name=doctor_id><option value="">Médico</option>{% for d in docs %}<option value={{d.id}}>{{d.name}}</option>{% endfor %}</select><select name=bed><option value="">Sin cama</option>{% for b in beds %}<option>{{b.bed}}</option>{% endfor %}</select><input name=notes placeholder="Observación"><button>Abrir admisión</button></form></div><div class=panel><table><tr><th>ID</th><th>Paciente</th><th>Área</th><th>Médico</th><th>Cama</th><th>Estado</th><th>Acciones</th></tr>{% for x in rows %}<tr><td>{{x.id}}</td><td>{{x.patient}}</td><td>{{x.type}}</td><td>{{x.doctor or '-'}}</td><td>{{x.bed or '-'}}</td><td>{{x.status}}</td><td>{% if x.status=='ABIERTA' %}<form action="/admissions/{{x.id}}/transfer" method=post style="display:inline"><select name=bed required>{% for b in beds %}<option>{{b.bed}}</option>{% endfor %}</select><button class="btn secondary">Internar</button></form><form action="/admissions/{{x.id}}/discharge" method=post style="display:inline"><button class="btn danger">Alta</button></form><form action="/invoice/{{x.id}}" method=post style="display:inline"><button>Facturar</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
