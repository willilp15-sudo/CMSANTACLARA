{% extends 'base.html' %}{% block content %}<h2>Editar cliente</h2><form method="post" class="card"><div class="grid">
<label>RUC / C.I.<input name="documento" value="{{r.documento or ''}}" required></label><label>DV (contribuyente)<input name="sifen_dv" maxlength="1" inputmode="numeric" placeholder="Se calcula si queda vacío"></label><label>Nombre / Razón social<input name="nombre" value="{{r.nombre or ''}}" required></label><label>Fecha nacimiento<input type="date" name="fecha_nacimiento" value="{{r.fecha_nacimiento or ''}}"></label><label>Teléfono<input name="telefono" value="{{r.telefono or ''}}"></label><label>Email<input type="email" name="email" value="{{r.email or ''}}"></label><label>Dirección<input name="direccion" value="{{r.direccion or r.sifen_direccion or ''}}"></label><label>N.º casa<input name="sifen_numero_casa" value="{{r.sifen_numero_casa or '0'}}"></label><label>Moneda<input name="moneda" value="{{r.moneda or 'PYG'}}"></label>
<label>Naturaleza<select name="sifen_naturaleza"><option value="1" {% if r.sifen_naturaleza=='1' %}selected{% endif %}>Contribuyente</option><option value="2" {% if r.sifen_naturaleza=='2' %}selected{% endif %}>No contribuyente</option></select></label><label>Operación<select name="sifen_tipo_operacion"><option value="1" {% if r.sifen_tipo_operacion=='1' %}selected{% endif %}>B2B</option><option value="2" {% if r.sifen_tipo_operacion=='2' %}selected{% endif %}>B2C</option><option value="3" {% if r.sifen_tipo_operacion=='3' %}selected{% endif %}>B2G</option><option value="4" {% if r.sifen_tipo_operacion=='4' %}selected{% endif %}>B2F</option></select></label><label>Tipo contribuyente<input name="sifen_tipo_contribuyente" value="{{r.sifen_tipo_contribuyente or '2'}}"></label><label>Tipo documento<input name="sifen_tipo_documento" value="{{r.sifen_tipo_documento or '1'}}"></label><label>N.º documento SIFEN<input name="sifen_numero_documento" value="{{r.sifen_numero_documento or r.documento or ''}}"></label><label>País<input name="sifen_pais" value="{{r.sifen_pais or 'PRY'}}"></label><label>País descripción<input name="sifen_pais_desc" value="{{r.sifen_pais_desc or 'Paraguay'}}"></label>
<label>Cód. departamento<input name="sifen_departamento_codigo" value="{{r.sifen_departamento_codigo or ''}}"></label><label>Departamento<input name="sifen_departamento_desc" value="{{r.sifen_departamento_desc or ''}}"></label><label>Cód. distrito<input name="sifen_distrito_codigo" value="{{r.sifen_distrito_codigo or ''}}"></label><label>Distrito<input name="sifen_distrito_desc" value="{{r.sifen_distrito_desc or ''}}"></label><label>Cód. ciudad<input name="sifen_ciudad_codigo" value="{{r.sifen_ciudad_codigo or ''}}"></label><label>Ciudad<input name="sifen_ciudad_desc" value="{{r.sifen_ciudad_desc or ''}}"></label>
</div><label>Motivo<input name="motivo" value="Actualización de datos"></label><button>Guardar</button> <a href="/clientes">Cancelar</a></form>{% endblock %}
