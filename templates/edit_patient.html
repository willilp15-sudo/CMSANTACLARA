{% extends 'base.html' %}{% block content %}<h2>Editar paciente</h2><form method=post class=grid><input name=documento value="{{r.documento}}" required><input name=nombre value="{{r.nombre}}" required><input type=date name=fecha_nacimiento value="{{r.fecha_nacimiento or ''}}"><input name=telefono value="{{r.telefono or ''}}" placeholder=Teléfono><input name=direccion value="{{r.direccion or ''}}" placeholder=Dirección><input name=motivo placeholder="Motivo de modificación" required><button>Guardar cambios</button><a class=btn href="/pacientes">Cancelar</a></form>{% endblock %}
