<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turnos Web - Santa Clara</title><style>body{font-family:Arial;background:#f3f6f8;margin:0;color:#17313b}.wrap{max-width:1050px;margin:auto;padding:24px}.hero,.card{background:white;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}input,select,textarea,button{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd7dc;border-radius:8px}button{background:#146b78;color:white;border:0;font-weight:bold;cursor:pointer}.slot{border:1px solid #d8e4e7;border-radius:10px;padding:14px}.small{font-size:13px;color:#61737a}h1{margin:0 0 8px}</style></head><body><div class="wrap"><div class="hero"><h1>Centro Médico Santa Clara</h1><p>Agendamiento de turnos y consultas por web</p><form method="get" class="grid"><label>Fecha<input type="date" name="fecha" value="{{fecha}}" required></label><label>Especialidad<select name="especialidad"><option value="">Todas</option>{% for e in especialidades %}<option {% if especialidad==e.especialidad %}selected{% endif %}>{{e.especialidad}}</option>{% endfor %}</select></label><label>&nbsp;<button>Buscar horarios</button></label></form></div><div class="grid">{% for s in slots %}<div class="slot"><b>{{s.hora}} — {{s.medico}}</b><div class="small">{{s.especialidad}} {% if s.consultorio %}· {{s.consultorio}}{% endif %}</div><form method="post" action="/turnos-web/reservar"><input type="hidden" name="fecha" value="{{fecha}}"><input type="hidden" name="hora" value="{{s.hora}}"><input type="hidden" name="medico_id" value="{{s.medico_id}}"><input name="documento" placeholder="C.I. / Documento"><input name="paciente" placeholder="Nombre y apellido" required><input name="telefono" placeholder="Teléfono / WhatsApp" required><input type="email" name="email" placeholder="Correo electrónico"><textarea name="motivo" placeholder="Motivo de consulta"></textarea><button>Reservar este turno</button></form></div>{% else %}<div class="card">No hay horarios disponibles para los filtros seleccionados.</div>{% endfor %}</div></div></body></html>
