{% extends 'base.html' %}{% block title %}Nota de Débito{% endblock %}{% block content %}<div class="card" style="max-width:1000px;margin:auto"><h2>Nota de Débito de Venta</h2><p><b>Factura:</b> {{v.numero}} · <b>Cliente:</b> {{v.cliente}} · <b>CDC factura:</b> {{v.cdc or 'Sin CDC'}} </p><form method="post"><label>Motivo</label><textarea name="motivo" required style="width:100%"></textarea><label>Concepto / descripción</label><input name="descripcion" required style="width:100%"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><div><label>Cantidad</label><input type="number" name="cantidad" value="1" min="0.01" step="0.01" required></div><div><label>Precio</label><input type="number" name="precio" min="1" step="1" required></div><div><label>IVA</label><select name="iva_pct"><option value="10">10%</option><option value="5">5%</option><option value="0">Exento</option></select></div></div><button class="btn" type="submit">Emitir Nota de Débito</button> <a class="btn" href="/ventas/{{v.id}}/factura">Cancelar</a></form></div>{% endblock %}
