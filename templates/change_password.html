{% extends 'base.html' %}
{% block title %}Cambiar mi contraseña{% endblock %}
{% block content %}
<h2>Cambiar mi contraseña</h2>
<div class="panel" style="max-width:620px">
<p class="muted">Este cambio afecta únicamente a su propio usuario.</p>
<form method="post" class="grid">
<label>Contraseña actual<input type="password" name="clave_actual" autocomplete="current-password" required></label>
<label>Nueva contraseña<input type="password" name="clave_nueva" minlength="6" autocomplete="new-password" required></label>
<label>Confirmar nueva contraseña<input type="password" name="confirmar_clave" minlength="6" autocomplete="new-password" required></label>
<button>🔐 Cambiar contraseña</button>
</form>
</div>
{% endblock %}
