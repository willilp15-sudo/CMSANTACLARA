{% extends 'base.html' %}{% block title %}Cobro de Venta a Crédito{% endblock %}{% block content %}<div class="card"><h2>Cobro de venta a crédito</h2><p><b>Cliente:</b> {{r.cliente}} · <b>Factura:</b> {{r.factura}} · <b>Saldo:</b> {{'{:,.2f}'.format(r.saldo) }} {{r.moneda}}</p><form method="post" class="grid"><label>Fecha<input type="date" name="fecha" required></label><label>Importe<input type="number" step="0.01" min="0.01" max="{{r.saldo}}" name="importe" value="{{r.saldo}}" required></label><label>Forma de cobro<select name="medio" required>{% for x in formas %}<option>{{x}}</option>{% endfor %}</select></label><label>Referencia / operación<input name="referencia" placeholder="N.º transferencia, POS, depósito..."></label><label>Cuenta receptora<select name="cuenta_bancaria_id"><option value="">-- No aplica / seleccionar --</option>{% for b in cuentas %}<option value="{{b.id}}">{{b.banco}} · {{b.alias or b.numero_cuenta}}</option>{% endfor %}</select></label><label>Terminal POS<select name="terminal_pos_id"><option value="">-- No aplica --</option>{% for p in poses %}<option value="{{p.id}}">{{p.nombre}}</option>{% endfor %}</select></label><label>Tipo de cambio<input type="number" step="0.0001" name="tipo_cambio" value="{{r.tipo_cambio_origen}}"></label><button>💳 Registrar cobro y generar recibo</button></form></div>{% endblock %}
