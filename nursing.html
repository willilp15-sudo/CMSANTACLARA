{% extends 'base.html' %}{% block c %}<h1>Enfermería</h1><div class=panel><form method=post class=form><label>Paciente admitido<select name=admission_id>{% for a in ads %}<option value={{a.id}}>#{{a.id}} {{a.name}}</option>{% endfor %}</select></label><label>Signos vitales<input name=vitals placeholder='PA 120/80 · T 36.5 · FC 75'></label><label>Nota de enfermería<textarea name=note required></textarea></label><button>Guardar evolución</button></form></div><div class=panel><table><tr><th>Fecha</th><th>Paciente</th><th>Signos</th><th>Evolución</th></tr>{% for r in rows %}<tr><td>{{r.created}}</td><td>{{r.patient}}</td><td>{{r.vitals}}</td><td>{{r.note}}</td></tr>{% endfor %}</table></div>{% endblock %}
