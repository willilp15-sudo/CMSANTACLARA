{% extends 'base.html' %}{% block content %}<h1>Quirófano</h1><div class=panel><form method=post class=inline><select name=admission_id>{% for a in ads %}<option value={{a.id}}>#{{a.id}} {{a.name}}</option>{% endfor %}</select><select name=doctor_id>{% for d in docs %}<option value={{d.id}}>{{d.name}}</option>{% endfor %}</select><input name=procedure placeholder=Procedimiento required><input name=room placeholder="Sala"><input type=datetime-local name=start_at><input name=price type=number step=.01 placeholder=Precio><input name=cost type=number step=.01 placeholder=Costo><button>Programar</button></form></div><div class=panel><table><tr><th>Paciente</th><th>Procedimiento</th><th>Médico</th><th>Sala</th><th>Fecha</th><th>Estado</th></tr>{% for x in rows %}<tr><td>{{x.patient}}</td><td>{{x.procedure}}</td><td>{{x.doctor}}</td><td>{{x.room}}</td><td>{{x.start_at}}</td><td>{{x.status}}</td></tr>{% endfor %}</table></div>{% endblock %}
